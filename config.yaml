paths:
  default_folder: "~/data/GarminFits"
  cache_file: "cache_data.parquet"

performance:
  gps_rounding: 5   # Decimals kept for gps precision (5 decimals means ~1.1m rounding, 4 decimals means ~11m)

ui:
  port: 8080
  title: "Sport heatmap"
  default_lat: 48.8566
  default_lon: 2.3522
  default_zoom: 11
  excluded_sports: ['81', '70', 'None', 'dance', 'generic']
  min_date: "2023-01-01"   # Earliest date selectable — filters out aberrant GPS timestamps